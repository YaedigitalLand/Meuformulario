<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <div class="nav-links">
       <img src="Design.png" alt="LogodaYEA" />
      
      <!-- Container do botão Quem é a YEA com o texto embutido -->
      <div class="dropdown-container">
        <a href="#" id="link-yea">Quem é a YEA</a>
        
        <div id="texto-yea" class="conteudo-escondido">
          <h3>Sobre a YEA</h3>
          <p>A YEA Digital é uma empresa focada em estratégias de marketing digital, tráfego pago e soluções para alavancar negócios na internet.</p>
        </div>
      </div>

   
    </div>

    <h2 class="title">Fale Conosco</h2>

    <form>
      <input type="text" class="input-field" placeholder="Digite seu nome *" required>
      <input type="email" class="input-field" placeholder="Seu melhor e-mail *" required>
      <input type="url" class="input-field" placeholder="Cole o link do seu Instagram *">
      <textarea class="input-field" placeholder="Escreva sua mensagem..."></textarea>
      
      <button type="submit" class="btn-submit">Enviar Mensagem</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
